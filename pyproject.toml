[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apm-home-agent"
version = "0.1.0"
description = "Local Gemma home-control prototype"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23", "soundfile>=0.13", "librosa>=0.11", "sounddevice>=0.5", "openwakeword==0.6.0", "onnxruntime>=1.18", "webrtcvad-wheels>=2.0.14"]

[project.optional-dependencies]
home = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websocket-client>=1.8,<2"]
apple-music = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "PyJWT[crypto]>=2.9,<3"]
wake-training = ["onnx>=1.16", "scikit-learn>=1.7"]
transformers = ["torch>=2.6", "kernels>=0.12; sys_platform == 'darwin'", "torchvision>=0.21", "pillow>=11", "transformers>=5.18,<6", "accelerate>=1"]


[project.scripts]
apm = "apm.cli:main"
apm-server = "apm.server:main"
apm-music = "apm.apple_music_server:main"

[tool.setuptools.packages.find]
include = ["apm*"]

[tool.setuptools.package-data]
apm = ["static/*.html", "static/*.js"]
